name: ui_kit
description: Shared design tokens, theme and widgets for the medical inventory apps.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Tajawal (SIL Open Font License, fonts/OFL.txt). Apps use it as
  # 'packages/ui_kit/Tajawal' through AppTheme.fontFamily.
  fonts:
    - family: Tajawal
      fonts:
        - asset: fonts/Tajawal-Regular.ttf
        - asset: fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: fonts/Tajawal-ExtraBold.ttf
          weight: 800
